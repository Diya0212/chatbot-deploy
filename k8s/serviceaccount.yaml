# ServiceAccount annotated with the IAM role ARN — this is how IRSA works.
# The pod assumes this SA, and AWS grants it temporary credentials for that role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot-sa
  namespace: chatbot
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/chatbot-irsa-role  # replace
