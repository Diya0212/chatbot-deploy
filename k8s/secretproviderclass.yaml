# Secrets Store CSI Driver — mounts AWS Secrets Manager secrets into the pod.
# Requires: Secrets Store CSI Driver + AWS Provider installed on the cluster.
# Install: https://secrets-store-csi-driver.sigs.k8s.io/getting-started/installation
#
# Create your secrets in AWS first:
#   aws secretsmanager create-secret --name chatbot/groq-api-key --secret-string "your-key"
#   aws secretsmanager create-secret --name chatbot/db-url \
#     --secret-string "postgresql://chatbot:<pwd>@<rds-endpoint>:5432/chatbot"
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: chatbot-secrets
  namespace: chatbot
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "chatbot/groq-api-key"
        objectType: "secretsmanager"
        objectAlias: "GROQ_API_KEY"
      - objectName: "chatbot/db-url"
        objectType: "secretsmanager"
        objectAlias: "DATABASE_URL"
  # Sync to a K8s Secret so envFrom can reference it
  secretObjects:
    - secretName: chatbot-app-secrets
      type: Opaque
      data:
        - objectName: "GROQ_API_KEY"
          key: GROQ_API_KEY
        - objectName: "DATABASE_URL"
          key: DATABASE_URL
